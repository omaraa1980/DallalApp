<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DallaMap Loader</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #feffdf;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      border: 4px solid rgba(16, 185, 129, 0.1);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border-left-color: #10B981;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      color: #10B981;
      font-size: 1.5rem;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <h1>Loading DallaMap...</h1>
  </div>
  <script>
    // In case the capacitor server URL config fails to load, redirect here
    window.location.href = "https://dallalmap.infinityfree.me/index.php";
  </script>
</body>
</html>
